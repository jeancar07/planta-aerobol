<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Planta Aerobol</title>
<meta name="theme-color" content="#0B111B">
<style>html,body{margin:0}[hidden]{display:none!important}*{box-sizing:border-box}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>


:root{
  --bg:#EEF1F4;--surface:#FFFFFF;--surface-2:#E4E8EE;--ink:#111A27;--muted:#5B6676;--line:#D3D9E1;
  --accent:#1F4E8C;--accent-soft:#E1EAF6;--navy:#111A27;
  --ok:#1D7A4C;--ok-bg:#DDF1E6;--bad:#C0302B;--bad-bg:#F9DEDD;--warn:#9A6200;--warn-bg:#F9EDCF;--idle:#8A94A3;
  --chart:#1F4E8C;--ref:#9AA4B2;
  --logo-navy:#1D3050;--logo-line:#B9C6D8;--logo-gold:#B8904F;--logo-spark:#DCE6F2;--logo-mist:#9DB0C8;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#0B111B;--surface:#131C29;--surface-2:#1B2636;--ink:#E8ECF2;--muted:#95A1B2;--line:#263245;
  --accent:#6FA3E8;--accent-soft:#16263D;--navy:#E8ECF2;
  --ok:#3DBE7C;--ok-bg:#10301F;--bad:#FF5F5A;--bad-bg:#3A1616;--warn:#F2B63C;--warn-bg:#35280B;--idle:#6B778A;
  --chart:#6FA3E8;--ref:#4D5B70;--logo-navy:#DCE3EE;--logo-line:#1D3050;--logo-gold:#D2AA6A;--logo-spark:#7E93B5;--logo-mist:#FFFFFF;
}}
:root[data-theme="dark"],html.tv{
  color-scheme:dark;--bg:#0B111B;--surface:#131C29;--surface-2:#1B2636;--ink:#E8ECF2;--muted:#95A1B2;--line:#263245;
  --accent:#6FA3E8;--accent-soft:#16263D;--navy:#E8ECF2;
  --ok:#3DBE7C;--ok-bg:#10301F;--bad:#FF5F5A;--bad-bg:#3A1616;--warn:#F2B63C;--warn-bg:#35280B;--idle:#6B778A;
  --chart:#6FA3E8;--ref:#4D5B70;--logo-navy:#DCE3EE;--logo-line:#1D3050;--logo-gold:#D2AA6A;--logo-spark:#7E93B5;--logo-mist:#FFFFFF;
}
html.tv{font-size:clamp(14px,1.05vw,24px)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.45}
*{box-sizing:border-box}
.num{font-variant-numeric:tabular-nums}
.app{max-width:1600px;margin:0 auto;padding-inline:16px;padding-block:14px 40px;display:flex;flex-direction:column;gap:14px}
html.tv .app{max-width:none;padding-inline:1.5rem}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;border-bottom:2px solid var(--ink);padding-bottom:10px}
.brand{display:flex;align-items:center;gap:6px 16px;flex-wrap:wrap;margin-right:auto}
.mark{height:4.4rem;width:auto;overflow:visible;flex:none}
.m-navy{fill:var(--logo-navy)}
.m-line{fill:none;stroke:var(--logo-line);stroke-width:1.2}
.m-gold{fill:var(--logo-gold)}
.m-swoosh{fill:none;stroke:var(--logo-gold);stroke-width:2.2;stroke-linecap:round}
.m-spark circle{fill:var(--logo-spark);animation:twinkle 2.6s ease-in-out infinite}
.m-spark circle:nth-child(2n){animation-delay:.9s}.m-spark circle:nth-child(3n){animation-delay:1.7s}
.m-mist circle{fill:var(--logo-mist);transform-box:fill-box;transform-origin:center;opacity:0;animation:mist 2.8s ease-out infinite;animation-delay:var(--d)}
@keyframes mist{0%{opacity:0;transform:translate(0,0) scale(.4)}15%{opacity:.95}100%{opacity:0;transform:translate(38px,var(--y)) scale(1.9)}}
@keyframes twinkle{0%,100%{opacity:.35}50%{opacity:1}}
.word{display:flex;flex-direction:column;align-items:center;gap:3px;line-height:1}
.word b{font-family:"Michroma","Barlow Condensed",Arial,sans-serif;font-weight:400;font-size:1.55rem;letter-spacing:.08em;color:var(--logo-navy)}
.word b span{color:var(--logo-gold)}
.word em{font-style:normal;font-family:var(--body);font-size:.62rem;font-weight:600;letter-spacing:.55em;color:var(--muted);display:flex;align-items:center;gap:8px;width:100%;padding-left:.55em}
.word em::before,.word em::after{content:"";flex:1;height:1px;background:var(--logo-gold);opacity:.7}
.brand small{font-family:var(--display);font-weight:500;font-size:1.15rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;border-left:1px solid var(--line);padding-left:16px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--bad)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 0 var(--bad);animation:live 1.8s ease-out infinite}
@keyframes live{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 60%,transparent)}100%{box-shadow:0 0 0 9px transparent}}
.clock{font-family:var(--display);font-weight:600;font-size:1.9rem;line-height:1}
.shift{font-size:.8rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:3px;background:var(--surface-2);color:var(--muted)}
.shift.on{background:var(--ok-bg);color:var(--ok)}
.shift.lunch{background:var(--warn-bg);color:var(--warn)}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--muted);font:600 .8rem var(--body);letter-spacing:.05em;text-transform:uppercase;padding:7px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
input,select,button{font:inherit;color:inherit}
input[type=date],select,input[type=number],input[type=text]{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:7px 9px;min-width:0}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:8px 12px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.btn.danger{background:var(--bad);color:#fff;border-color:var(--bad);font-weight:600}
.btn.good{background:var(--ok);color:#fff;border-color:var(--ok);font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}

.banner{padding:10px 14px;border-radius:4px;background:var(--warn-bg);color:var(--warn);font-weight:500}
.banner.bad{background:var(--bad-bg);color:var(--bad)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi .lbl{font-size:.72rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.kpi .val{font-family:var(--display);font-weight:700;font-size:3.1rem;line-height:1.02;font-variant-numeric:tabular-nums}
.kpi .val small{font-size:1.2rem;font-weight:600;color:var(--muted);margin-left:4px}
.kpi .sub{font-size:.85rem;color:var(--muted)}
.kpi.lead{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kpi.lead .lbl,.kpi.lead .sub,.kpi.lead .val small{color:inherit;opacity:.72}
.delta-up{color:var(--ok);font-weight:600}.delta-down{color:var(--bad);font-weight:600}
.bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}

.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:980px){
  .layout.with-panel{grid-template-columns:360px minmax(0,1fr)}
}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px;min-width:0}
.card h2{margin:0 0 10px;font-family:var(--display);font-weight:600;font-size:1.35rem;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.card h2 .aside{margin-left:auto;font-family:var(--body);font-size:.85rem;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted)}

.machines{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.mach{border:1px solid var(--line);border-left:8px solid var(--idle);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.mach.ok{border-left-color:var(--ok)}
.mach.bad{border-left-color:var(--bad);background:var(--bad-bg)}
.mach .head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mach .name{font-family:var(--display);font-weight:600;font-size:1.3rem}
.pill{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:3px;background:var(--surface-2);color:var(--idle)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.bad{background:var(--bad);color:#fff}
.mach .big{font-family:var(--display);font-weight:700;font-size:2.6rem;line-height:1}
.mach .big small{font-size:1rem;color:var(--muted);font-weight:600;margin-left:4px}
.mach dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0;font-size:.85rem}
.mach dt{color:var(--muted)}.mach dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.mach .nota{font-size:.85rem;color:var(--bad);font-weight:600}
.mach.bad .blink{animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}

.chart-wrap{overflow-x:auto}
.chart-wrap svg{display:block;width:100%;min-width:520px;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.8rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:18px;height:0;border-top:3px solid var(--chart);vertical-align:middle;margin-right:6px}
.legend i.proj{border-top-style:dashed;border-color:var(--accent)}
.legend i.ref{border-top:2px dotted var(--ref)}
.legend i.meta{border-top:2px solid var(--ok)}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{font-size:.7rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:right;padding:6px 8px;border-bottom:1px solid var(--ink);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td:first-child{white-space:normal}
td .unit{color:var(--muted);font-size:.78rem;margin-left:3px}
td .note{display:block;color:var(--muted);font-size:.74rem}
tr.grp td{background:var(--surface-2);font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:4px 8px}
tr.limit td{background:var(--warn-bg)}
tr.out td{background:var(--bad-bg);color:var(--bad)}
tfoot td{font-weight:600;border-top:1px solid var(--ink);border-bottom:0}
.lvl{display:inline-block;width:70px;height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;vertical-align:middle}
.lvl i{display:block;height:100%;background:var(--ok)}
.lvl i.low{background:var(--warn)}.lvl i.empty{background:var(--bad)}

.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.log li{display:grid;grid-template-columns:4.2rem 1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.log time{font-family:var(--mono);font-size:.82rem;color:var(--muted)}
.log .t-falla{color:var(--bad);font-weight:600}.log .t-reanuda{color:var(--ok);font-weight:600}
.log .muted{color:var(--muted)}
.empty{color:var(--muted);font-size:.9rem;padding:8px 0}

.panel .block{display:flex;flex-direction:column;gap:10px;padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.panel .block:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
.panel h3{margin:0;font-size:.75rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:4px;font-size:.85rem}
.field label{color:var(--muted)}
.stepper{display:grid;grid-template-columns:3.2rem 1fr 3.2rem;gap:6px;align-items:stretch}
.stepper button{font-size:1.6rem;font-weight:600;border:1px solid var(--line);background:var(--surface-2);border-radius:4px;cursor:pointer;min-height:3.2rem}
.stepper input{text-align:center;font-family:var(--display);font-weight:700;font-size:2.2rem;padding:2px}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{flex:1;min-width:3.5rem}
.calc{font-size:.9rem;color:var(--muted)}
.calc b{color:var(--ink);font-variant-numeric:tabular-nums}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.inv-grid{display:grid;grid-template-columns:1fr 7.5rem;gap:6px 8px;align-items:center;font-size:.85rem}
.inv-grid .g{grid-column:1/-1;font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.inv-grid input{text-align:right;width:100%}
details summary{cursor:pointer;font-weight:600;list-style-position:inside}
.mach-ctrl{display:flex;flex-direction:column;gap:8px;padding:10px;border:1px solid var(--line);border-radius:4px}
.mach-ctrl .t{display:flex;justify-content:space-between;align-items:center;font-weight:600}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:4px;font-weight:500;box-shadow:0 6px 24px rgb(0 0 0 / .25);z-index:10;max-width:calc(100% - 32px)}
.toast.bad{background:var(--bad);color:#fff}

/* movimiento */
.mach{position:relative;overflow:hidden}
.belt{position:absolute;left:0;right:0;bottom:0;height:4px;background:repeating-linear-gradient(90deg,var(--ok) 0 14px,transparent 14px 24px);background-size:24px 4px;opacity:.55;animation:belt .9s linear infinite}
@keyframes belt{to{background-position:24px 0}}
.mach.bad{animation:alarm 1.6s ease-in-out infinite}
@keyframes alarm{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 0%,transparent)}50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--bad) 35%,transparent)}}
.bar i,.lvl i{transition:width .9s cubic-bezier(.2,.7,.2,1)}
.kpi,.card,.mach{transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}
.kpi:hover{transform:translateY(-2px);box-shadow:0 8px 22px -12px rgb(15 27 45 / .45)}
html.boot .kpi,html.boot .card{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
html.boot .kpi:nth-child(2){animation-delay:.08s}html.boot .kpi:nth-child(3){animation-delay:.16s}html.boot .kpi:nth-child(4){animation-delay:.24s}
html.boot .stack>.card:nth-child(2){animation-delay:.15s}html.boot .stack>.card:nth-child(3){animation-delay:.25s}html.boot .stack>.card:nth-child(4){animation-delay:.35s}
html.boot .panel{animation:rise .7s cubic-bezier(.2,.7,.2,1) .1s both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
html.boot .top{animation:drop .6s ease-out both}
@keyframes drop{from{opacity:0;transform:translateY(-10px)}}
html.boot .real{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.6s cubic-bezier(.4,0,.2,1) .3s forwards}
html.boot .area{animation:fade 1s ease .9s both}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0}}
.proj{animation:march 1.2s linear infinite}
@keyframes march{to{stroke-dashoffset:-24}}
.nowdot{transform-box:fill-box;transform-origin:center;animation:dot 1.8s ease-out infinite}
@keyframes dot{0%{r:5;opacity:.9}100%{r:16;opacity:0}}
.log li.new{animation:slidein .6s cubic-bezier(.2,.7,.2,1) both, flash 2.4s ease-out both}
@keyframes slidein{from{opacity:0;transform:translateX(-14px)}}
@keyframes flash{0%{background:var(--accent-soft)}100%{background:transparent}}
.toast:not([hidden]){animation:toast .35s cubic-bezier(.2,.7,.2,1)}
@keyframes toast{from{opacity:0;transform:translate(-50%,12px)}}
.bump{animation:bump .5s ease}
@keyframes bump{40%{transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.m-mist circle{opacity:0}}
html.tv .only-tablet{display:none!important}
html:not(.tv) .only-tv{display:none!important}
html.tv .mach .big{font-size:3.4rem}
html.tv .kpi .val{font-size:3.8rem}
@media (max-width:520px){.kpi .val{font-size:2.5rem}.word b{font-size:1.2rem}.brand small{border-left:0;padding-left:0}}

/* ───────── base de documento propio ───────── */
html,body{margin:0;min-height:100%}
body{-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
#espuma{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.app{position:relative;z-index:1}
.userchip{display:inline-flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted)}
.userchip b{color:var(--ink);font-weight:600}
.userchip .rol{font-size:.66rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;padding:3px 7px;border-radius:3px;background:var(--accent-soft);color:var(--accent)}

@media (prefers-reduced-motion:reduce){.login{clip-path:none}.login.out{display:none}}
.kpi .val.val-sm{font-size:2.2rem}
html.tv .kpi .val.val-sm{font-size:2.6rem}


/* ── sobrio: solo información ── */
.brand-t{margin-right:auto}
.brand-t .bt-txt{display:flex;flex-direction:column;gap:2px;line-height:1.1}
.brand-t .bt-txt small{font-size:.72rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.brand-t .bt-txt b{font-family:var(--display);font-weight:700;font-size:1.8rem;letter-spacing:.02em}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.brand .mark{height:3.6rem}
.brand small{font-family:var(--display);font-weight:600;font-size:1.25rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;border-left:1px solid var(--line);padding-left:16px}
.bar i{background:var(--accent)}
.mach .big,.mach dl{padding-right:0}
html.tv .kpi.lead{background:var(--accent-soft);color:var(--ink);border-color:var(--accent)}
.hist tbody tr{cursor:pointer;transition:background .2s}
.hist tbody tr:hover td{background:var(--surface-2)}
.hist tbody tr.sel td{background:var(--accent-soft)}
.hist td b{font-family:var(--display);font-size:1.15rem}
#histChart svg{min-width:520px}
#histChart rect{transition:opacity .2s}#histChart rect:hover{opacity:.8}
.bgfx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.app{position:relative;z-index:1}
.kpi,.card{background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.kpi.lead{backdrop-filter:none}

/* tarjetas: luz que sigue el cursor */
.kpi,.card,.mach{position:relative;isolation:isolate;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,border-color .25s}
.kpi::after,.card::after,.mach::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;opacity:0;transition:opacity .3s;
  background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--accent) 16%,transparent),transparent 60%)}
.kpi:hover::after,.card:hover::after,.mach:hover::after{opacity:1}
.kpi:hover{transform:translateY(-4px) perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));box-shadow:0 18px 36px -18px rgb(10 20 35 / .45);border-color:var(--accent)}
.card:hover{box-shadow:0 18px 40px -24px rgb(10 20 35 / .4);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.mach:hover{transform:translateY(-3px);box-shadow:0 14px 30px -18px rgb(10 20 35 / .45)}
.kpi .val{transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.kpi:hover .val{transform:translateX(4px)}

/* botones */
.btn,.seg button,.stepper button,.quick button,.shift,.pill,input,select{transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .2s,background .2s,border-color .2s,color .2s}
.btn,.seg button,.stepper button{position:relative;overflow:hidden}
.btn:hover:not(:disabled),.stepper button:hover{transform:translateY(-2px);box-shadow:0 8px 18px -10px rgb(10 20 35 / .5);border-color:var(--accent)}

.btn.danger:hover:not(:disabled){box-shadow:0 10px 22px -10px var(--bad)}

.seg{position:relative}
.seg .ind{position:absolute;top:0;bottom:0;left:0;background:var(--ink);border-radius:3px;transition:transform .35s cubic-bezier(.2,.8,.2,1),width .35s;z-index:0}

.seg button[aria-pressed="true"]{color:var(--bg)}
.seg button:hover:not([aria-pressed="true"]){color:var(--ink)}
input:hover,select:hover{border-color:var(--accent)}

.pill:hover,.shift:hover{transform:scale(1.06)}

/* logo */

/* tablas y bitácora */

.log li:hover{background:var(--surface-2);transform:translateX(4px)}

/* gráficas interactivas */

@media (prefers-reduced-motion:reduce){.kpi:hover,.mach:hover,.btn:hover{transform:none!important}.bgfx{display:none}}
.login{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:24px 16px;transition:opacity .45s,transform .45s}

<script type="module">
const firebaseConfig = {
  apiKey: "AIzaSyD-7XXfvPJIwRzICKsbI2ZeQ4oa14AQzIU",
  authDomain: "planta-aerobol.firebaseapp.com",
  projectId: "planta-aerobol",
  storageBucket: "planta-aerobol.firebasestorage.app",
  messagingSenderId: "431372794656",
  appId: "1:431372794656:web:8b94f3191f86ac99283545"
};




/* ---------- Fórmula por unidad: Espuma Torito 1000 (Excel suministrado) ---------- */
const MAT = [
  {k:'genapol',   n:'Genapol LRO 28% (Lauril-Caflon-Kapol Less)', g:'Núcleo', q:10.81,  u:'g',   c:45.13},
  {k:'fragancia', n:'Fragancia Plumeria Ref. 2022885',            g:'Núcleo', q:1.01,   u:'g',   c:55.65},
  {k:'comperland',n:'Comperland (Cocoamide-Proamide)',            g:'Núcleo', q:6.3,    u:'g',   c:61.43},
  {k:'benzoato',  n:'Benzoato de sodio',                          g:'Núcleo', q:0.18,   u:'g',   c:1.98},
  {k:'citrico',   n:'Ácido cítrico',                              g:'Núcleo', q:0.06,   u:'g',   c:0.52},
  {k:'edta',      n:'E.D.T.A. disódico USP',                      g:'Núcleo', q:0.12,   u:'g',   c:4.32},
  {k:'agua',      n:'Agua desmineralizada',                       g:'Núcleo y llenado', q:451.725, u:'g', c:16.94, nota:'41,725 g en núcleo + 410 g en llenado'},
  {k:'gas',       n:'Gas A70',                                    g:'Envasado', q:53.4, u:'g',   c:275.54},
  {k:'envase',    n:'Envase hojalata 1000 Diversiones',           g:'Envasado', q:1,    u:'und', c:1303.00},
  {k:'valvula',   n:'Válvula insecticida espuma Torito acond.',   g:'Envasado', q:1,    u:'und', c:143.39},
  {k:'gatillo',   n:'Gatillo espuma multicolores',                g:'Envasado', q:1,    u:'und', c:184.72},
  {k:'caja',      n:'Caja cartón Torito 1000 x 24 und',           g:'Envasado', q:1/24, u:'caja',c:121.31},
  {k:'cinta',     n:'Cinta transparente Bolten',                  g:'Envasado', q:4.33, u:'cm',  c:1.69},
];
const COSTO_U = MAT.reduce((s,m)=>s+m.c,0);           // $2.215,62
const UXC = 24, T_INI = 420, T_FIN = 1020, ALM_I = 720, ALM_F = 780;
const OFF = -5*60*60000;                              // Bogotá UTC-5, sin horario de verano

/* display units: g→kg, cm→m */
const dU = u => u==='g'?'kg':u==='cm'?'m':u;
const toD = (m,v) => m.u==='g'?v/1000:m.u==='cm'?v/100:v;
const fromD = (m,v) => m.u==='g'?v*1000:m.u==='cm'?v*100:v;

const nf0 = new Intl.NumberFormat('es-CO',{maximumFractionDigits:0});
const nf1 = new Intl.NumberFormat('es-CO',{maximumFractionDigits:1});
const nf2 = new Intl.NumberFormat('es-CO',{minimumFractionDigits:2,maximumFractionDigits:2});
const money = v => '$'+nf0.format(Math.round(v));
const fmtD = (m,v) => { const x = toD(m,v); return (m.u==='und'||m.u==='caja') ? nf1.format(x) : nf2.format(x); };
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function bog(ts=Date.now()){
  const d = new Date(ts+OFF);
  return {key:d.toISOString().slice(0,10), min:d.getUTCHours()*60+d.getUTCMinutes()+d.getUTCSeconds()/60};
}
function hhmm(min){ let h=Math.floor(min/60), m=Math.floor(min%60); const ap=h<12?'a.m.':'p.m.'; const h12=((h+11)%12)+1; return `${h12}:${String(m).padStart(2,'0')} ${ap}`; }
const ov = (a,b,x,y) => Math.max(0, Math.min(b,y)-Math.max(a,x));
const prodMin = (a,b) => ov(a,b,T_INI,T_FIN) - ov(a,b,ALM_I,ALM_F);
const JORNADA = prodMin(0,1440); // 540 min productivos

/* ---------- animación de arranque ---------- */
let bootOff=null;
function startBoot(){ document.documentElement.classList.add('boot'); clearTimeout(bootOff); bootOff=setTimeout(()=>document.documentElement.classList.remove('boot'), 3200); }

/* ---------- estado ---------- */
const S = {
  fb:null, user:null, rol:null, nombre:'', canWrite:false, dbState:'cargando',
  cfg:{maquinas:[], meta:null, historico:[]},
  dia:null, viewKey:bog().key, todayKey:bog().key,
  unsubDia:null, unsubCfg:null, draft:{maq:null, cajas:0, sueltas:0}, confirmDel:null, notaFalla:{}
};
let mode = 'tablet';
const foam = {add(){},clear(){},burstAt(){},confettiAt(){},set ambient(v){},set tint(v){},set confettiRate(v){}};

/* ---------- cálculo ---------- */
function compute(){
  const isToday = S.viewKey===S.todayKey;
  const now = bog();
  const nowMin = isToday ? now.min : 1440;
  const ev = (S.dia?.eventos||[]).slice().sort((a,b)=>a.ts-b.ts);
  const maqs = S.cfg.maquinas.length ? S.cfg.maquinas : [{id:'m1',nombre:'Máquina 1'}];
  const M = {};
  for(const m of maqs) M[m.id] = {id:m.id, nombre:m.nombre, und:0, lastTs:null, down:false, downSince:null, downMin:0, nota:'', fallas:0};
  const pts = [];
  let total = 0;
  for(const e of ev){
    const m = M[e.maq] || (M[e.maq] = {id:e.maq, nombre:e.maq, und:0,lastTs:null,down:false,downSince:null,downMin:0,nota:'',fallas:0});
    if(e.tipo==='prod'){ m.und += e.unidades; m.lastTs = e.ts; total += e.unidades; pts.push([bog(e.ts).min,total]); }
    else if(e.tipo==='falla'){ if(!m.down){ m.down=true; m.downSince=e.ts; } m.nota=e.nota||''; m.fallas++; }
    else if(e.tipo==='reanuda'){ if(m.down){ m.downMin += prodMin(bog(m.downSince).min, bog(e.ts).min); } m.down=false; m.downSince=null; m.nota=''; }
  }
  const elapsed = prodMin(0, nowMin);
  const remaining = isToday ? prodMin(nowMin, 1440) : 0;
  let proj = 0, projOk = false, rateTot = 0;
  for(const m of Object.values(M)){
    if(m.down) m.downMin += prodMin(bog(m.downSince).min, nowMin);
    m.eff = Math.max(0, elapsed - m.downMin);
    m.rate = (m.und>0 && m.eff>=15) ? m.und/m.eff : null;           // u/min productivo
    if(m.rate){ rateTot += m.rate; proj += m.und + m.rate*remaining; projOk = true; }
    else proj += m.und;
  }
  if(remaining===0){ proj = total; projOk = true; }
  const hist = (S.cfg.historico||[]).filter(h=>h.unidades>0);
  const refAvg = hist.length ? hist.reduce((s,h)=>s+h.unidades,0)/hist.length : null;
  const refNow = refAvg!=null ? refAvg*elapsed/JORNADA : null;
  const inicio = S.dia?.inicio || null;
  const mats = MAT.map(m=>{
    const cons = total*m.q;
    const ini = inicio && inicio[m.k]!=null ? inicio[m.k] : null;
    const rest = ini!=null ? ini-cons : null;
    const alc = rest!=null ? Math.max(0, Math.floor(rest/m.q + 1e-9)) : null;
    return {...m, cons, ini, rest, alc};
  });
  const withInv = mats.filter(m=>m.alc!=null);
  const limit = withInv.length ? withInv.reduce((a,b)=>a.alc<=b.alc?a:b) : null;
  return {isToday, now, nowMin, ev, M:Object.values(M), total, elapsed, remaining, proj:projOk?proj:null, rateTot, refAvg, refNow, hist, mats, limit, inicio};
}

/* ---------- render ---------- */
const $ = id => document.getElementById(id);
const prevVal = {};
const cnt = (k,v) => `<span class="cnt" data-k="${k}" data-v="${Math.round(v)}">${nf0.format(Math.round(prevVal[k] ?? 0))}</span>`;
function runCounters(root){
  root.querySelectorAll('.cnt').forEach(el=>{
    const k=el.dataset.k, to=+el.dataset.v, from=prevVal[k] ?? 0;
    prevVal[k]=to;
    if(from===to || matchMedia('(prefers-reduced-motion: reduce)').matches){ el.textContent=nf0.format(to); return; }
    const card = el.closest('.kpi,.mach'); if(card && k in prevVal && from!==0){ card.classList.remove('bump'); void card.offsetWidth; card.classList.add('bump'); }
    const t0=performance.now(), dur=1100;
    const step=t=>{ const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3); el.textContent=nf0.format(Math.round(from+(to-from)*e)); if(p<1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

function render(){
  const R = compute();
  document.documentElement.classList.toggle('tv', mode==='tv');
  $('mTablet').setAttribute('aria-pressed', mode==='tablet');
  $('mTv').setAttribute('aria-pressed', mode==='tv');
  $('layout').classList.toggle('with-panel', mode==='tablet' && S.canWrite && R.isToday);
  $('panel').hidden = !(mode==='tablet' && S.canWrite && R.isToday && S.fb);
  $('mTablet').parentElement.hidden = S.rol!=='admin';
  foam.tint = document.documentElement.classList.contains('tv') || matchMedia('(prefers-color-scheme: dark)').matches ? 'light' : 'dark';
  foam.confettiRate = 0;
  foam.ambient = mode==='tv' ? .05 : .015;

  $('clock').textContent = hhmm(R.now.min);
  const sh = $('shift'); const nm = R.now.min;
  if(nm>=T_INI && nm<ALM_I || nm>=ALM_F && nm<T_FIN){ sh.textContent='Turno en curso'; sh.className='shift on'; }
  else if(nm>=ALM_I && nm<ALM_F){ sh.textContent='Almuerzo'; sh.className='shift lunch'; }
  else { sh.textContent='Fuera de turno'; sh.className='shift'; }

  const b = $('banner');
  if(S.dbState==='sin-db'){ b.hidden=false; b.className='banner bad'; b.textContent='No hay conexión con la base de datos. Revisa internet; la página se reconecta sola.'; }
  else if(!R.isToday){ b.hidden=false; b.className='banner'; b.innerHTML=`Estás viendo el <b>${esc(fmtFecha(S.viewKey))}</b>. Los registros solo se hacen sobre el día de hoy. <button class="btn" id="volverHoy" style="margin-left:8px">Volver a hoy</button>`; $('volverHoy').onclick=()=>abrirDia(S.todayKey); }
  else b.hidden=true;

  renderKpis(R); renderMachines(R); renderChart(R); renderMaterials(R); renderLog(R); renderHist();
  requestAnimationFrame(segInd);
  if(!$('panel').hidden) renderPanel(R);
}

function fmtFecha(k){ const [y,m,d]=k.split('-').map(Number); return new Date(Date.UTC(y,m-1,d)).toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'}); }

function renderKpis(R){
  const cajas = Math.floor(R.total/UXC), sueltas = R.total%UXC;
  const meta = S.cfg.meta;
  let k = `<div class="kpi lead"><span class="lbl">Producido ${R.isToday?'hoy':'ese día'}</span><span class="val num">${cnt('total',R.total)}<small>und</small></span><span class="sub num">${nf0.format(cajas)} cajas${sueltas?` + ${sueltas} und`:''}</span></div>`;
  if(R.isToday){
    let projTxt = R.proj!=null ? cnt('proj',R.proj) : '—';
    let sub = R.remaining===0 ? 'Turno terminado' : (R.proj!=null ? `Al ritmo actual, sin más paradas` : 'Se calcula con 15 min de producción reportada');
    if(R.limit && R.proj!=null && R.proj > R.total + R.limit.alc) sub = `<span class="delta-down">Falta material: ${esc(R.limit.n.split(' (')[0])} alcanza para ${nf0.format(R.total+R.limit.alc)}</span>`;

  }

    const pct = Math.min(100, R.total/meta*100);
    k += `<div class="kpi"><span class="lbl">Meta del día</span><span class="val num">${nf0.format(meta)}<small>und</small></span><span class="sub num">${nf1.format(R.total/meta*100)} % cumplido · faltan ${nf0.format(Math.max(0,meta-R.total))}</span><div class="bar"><i style="width:${pct}%"></i></div></div>`;
  } else if(R.refAvg!=null){
    const d = R.total - R.refNow;
    k += `<div class="kpi"><span class="lbl">Vs. días anteriores</span><span class="val num val-sm">${R.hist.map(h=>nf0.format(h.unidades)).join(' · ')}</span><span class="sub num">${R.hist.map(h=>esc(h.etiqueta)).join(' · ')} · promedio ${nf0.format(R.refAvg)}${R.isToday&&R.elapsed>0?` · a esta hora iría en ${nf0.format(R.refNow)} (<span class="${d>=0?'delta-up':'delta-down'}">${d>=0?'+':''}${nf0.format(d)}</span>)`:''}</span></div>`;

    k += `<div class="kpi"><span class="lbl">Meta del día</span><span class="val">—</span><span class="sub">Sin meta definida</span></div>`;
  }

}

function niceMax(v){ if(v<=0) return 1000; const p=Math.pow(10,Math.floor(Math.log10(v))); for(const f of [1,1.2,1.5,2,2.5,3,4,5,6,8,10]) if(f*p>=v) return f*p; return 10*p; }

let CH=null;
function renderChart(R){
  const W=920,H=300,L=58,Rr=18,T=14,B=34;
  const meta = S.cfg.meta;
  const cands = [R.total, R.proj||0, meta||0, ...R.hist.map(h=>h.unidades)];
  const ymax = niceMax(Math.max(...cands)*1.05);
  const x = m => L + (Math.min(Math.max(m,T_INI),T_FIN)-T_INI)/(T_FIN-T_INI)*(W-L-Rr);
  const y = v => T + (1 - v/ymax)*(H-T-B);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Unidades acumuladas durante el turno">`;
  s += `<rect x="${x(ALM_I)}" y="${T}" width="${x(ALM_F)-x(ALM_I)}" height="${H-T-B}" fill="var(--surface-2)"/>`;
  s += `<text x="${(x(ALM_I)+x(ALM_F))/2}" y="${T+14}" text-anchor="middle" font-size="11" fill="var(--muted)">almuerzo</text>`;
  const step = ymax/5;
  for(let i=0;i<=5;i++){ const v=step*i; s += `<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${nf0.format(v)}</text>`; }
  for(let h=7;h<=17;h++){ const m=h*60; s += `<text x="${x(m)}" y="${H-12}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${h}:00</text>`; }
  // referencias: ritmo de días anteriores (plano en el almuerzo)
  for(const h of R.hist){
    const pace = m => h.unidades*prodMin(0,m)/JORNADA;
    const ps = [T_INI,ALM_I,ALM_F,T_FIN].map(m=>`${x(m)},${y(pace(m))}`).join(' ');
    s += `<polyline points="${ps}" fill="none" stroke="var(--ref)" stroke-width="1.5" stroke-dasharray="2 4"/><text x="${W-Rr-4}" y="${y(h.unidades)-5}" text-anchor="end" font-size="11" fill="var(--muted)">${esc(h.etiqueta)} · ${nf0.format(h.unidades)}</text>`;
  }

    let acc=0;
    for(const e of R.ev){ if(e.tipo!=='prod') continue; const m=bog(e.ts).min; d += ` L${x(m)},${y(acc)}`; acc+=e.unidades; d += ` L${x(m)},${y(acc)}`; }
    const endM = R.isToday ? Math.min(R.nowMin, T_FIN) : T_FIN;
    if(endM>T_INI) d += ` L${x(endM)},${y(acc)}`;
    s += `<path class="area" d="${d} L${x(endM>T_INI?endM:T_INI)},${y(0)} Z" fill="var(--chart)" fill-opacity=".08"/>`;
    s += `<path class="real" pathLength="1" d="${d}" fill="none" stroke="var(--chart)" stroke-width="3" stroke-linejoin="round"/>`;
    if(R.isToday && R.proj!=null && R.remaining>0 && R.nowMin>=T_INI){
      s += `<line x1="${x(R.nowMin)}" y1="${y(acc)}" x2="${x(T_FIN)}" y2="${y(R.proj)}" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="7 5" class="proj"/><circle cx="${x(T_FIN)}" cy="${y(R.proj)}" r="5" fill="var(--accent)"/><text x="${x(T_FIN)-8}" y="${y(R.proj)+18}" text-anchor="end" font-size="12" font-weight="600" fill="var(--accent)">${nf0.format(Math.round(R.proj))}</text>`;
    }
    if(R.isToday && R.nowMin>=T_INI && R.nowMin<=T_FIN){ s += `<line x1="${x(R.nowMin)}" x2="${x(R.nowMin)}" y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-width="1"/><circle class="nowdot" cx="${x(R.nowMin)}" cy="${y(acc)}" r="5" fill="var(--chart)"/><circle cx="${x(R.nowMin)}" cy="${y(acc)}" r="5" fill="var(--chart)"/>`; }
  }
  s += `</svg>`;
  $('chart').innerHTML = s + '<div class="tip" id="chTip"></div>';
  CH = {W,H,L,Rr,T,B,ymax,ev:R.ev.filter(e=>e.tipo==='prod'),hist:R.hist,nowMin:R.isToday?R.nowMin:1440,proj:R.proj,isToday:R.isToday,remaining:R.remaining};

function chartHover(e){

  if(sx<CH.L||sx>CH.W-CH.Rr){ chartOut(); return; }
  const min = T_INI + (sx-CH.L)/(CH.W-CH.L-CH.Rr)*(T_FIN-T_INI);
  const yy = v => CH.T + (1-v/CH.ymax)*(CH.H-CH.T-CH.B);
  let acc=0; for(const ev of CH.ev){ if(bog(ev.ts).min<=min) acc+=ev.unidades; }
  let val = acc, lbl='Acumulado';
  if(CH.isToday && min>CH.nowMin){
    if(CH.proj!=null && CH.remaining>0){ const base=CH.ev.reduce((s,x)=>s+x.unidades,0); const f=prodMin(CH.nowMin,min)/Math.max(1,prodMin(CH.nowMin,T_FIN)); val=Math.round(base+(CH.proj-base)*f); lbl='Proyectado'; }
    else { chartOut(); return; }
  }
  let xh = svg.querySelector('.xh');
  if(!xh){ xh=document.createElementNS('http://www.w3.org/2000/svg','g'); xh.setAttribute('class','xh'); xh.innerHTML='<line stroke="var(--muted)" stroke-dasharray="3 3"/><circle r="6" fill="var(--bg)" stroke="var(--accent)" stroke-width="3"/>'; svg.appendChild(xh); }

// fondo dinámico: malla de puntos en onda que se aparta del cursor + luces suaves
(function(){
  const cv=$('bgfx'); if(!cv || RM) return;
  const ctx=cv.getContext('2d'); let W=0,H=0,dpr=1, mx=-9999, my=-9999, sx=-9999, sy=-9999; const t0=performance.now();
  const size=()=>{ dpr=Math.min(2,devicePixelRatio||1); W=innerWidth; H=innerHeight; cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); };
  addEventListener('resize', size); size();
  addEventListener('pointermove', e=>{ mx=e.clientX; my=e.clientY; }, {passive:true});
  document.addEventListener('pointerleave', ()=>{ mx=my=-9999; });
  let cA='', cM='', last=0;
  function frame(now){
    requestAnimationFrame(frame);
    if(document.hidden) return;
    if(now-last > 2000 || !cA){ const cs=getComputedStyle(document.documentElement); cA=cs.getPropertyValue('--accent').trim(); cM=cs.getPropertyValue('--muted').trim(); last=now; }
    sx += (mx-sx)*.12; sy += (my-sy)*.12;
    const t=(now-t0)/1000;
    ctx.clearRect(0,0,W,H);
    for(let i=0;i<3;i++){
      const x = W*(.15+.7*((Math.sin(t*.06+i*2.1)+1)/2)), y = H*(.1+.8*((Math.cos(t*.05+i*1.7)+1)/2)), r = Math.max(W,H)*.42;
      const g = ctx.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0, cA); g.addColorStop(1,'transparent');
      ctx.globalAlpha = .08; ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    }
    const gap=34;
    for(let y=gap/2;y<H;y+=gap){
      for(let x=gap/2;x<W;x+=gap){
        const wv = Math.sin(x*.012 + t*.9) * Math.cos(y*.014 - t*.7);
        const d = Math.hypot(x-sx,y-sy), k = Math.max(0, 1-d/190);
        const dx = k ? (x-sx)/(d||1)*k*12 : 0, dy = k ? (y-sy)/(d||1)*k*12 : 0;
        ctx.beginPath(); ctx.arc(x+dx, y+dy+wv*2.5, 1.1 + k*2.4 + (wv+1)*.35, 0, 6.283);
        ctx.fillStyle = k>0 ? cA : cM; ctx.globalAlpha = .13 + k*.6 + (wv+1)*.05; ctx.fill();
      }
    }
    ctx.globalAlpha=1;
  }
  requestAnimationFrame(frame);
})();

/* ---------- historial ---------- */
function resumenDia(d){
  const ev = (d.eventos||[]).slice().sort((a,b)=>a.ts-b.ts);
  let und=0, cajas=0, fallas=0, down=0, primero=null, ultimo=null;
  const abiertas = {};
  const esHoy = d.fecha===S.todayKey;
  const fin = esHoy ? bog().min : T_FIN;
  for(const e of ev){
    const m = bog(e.ts).min;
    if(e.tipo==='prod'){ und+=e.unidades; if(primero==null) primero=m; ultimo=m; }
    else if(e.tipo==='falla'){ fallas++; if(abiertas[e.maq]==null) abiertas[e.maq]=m; }
    else if(e.tipo==='reanuda' && abiertas[e.maq]!=null){ down+=prodMin(abiertas[e.maq], m); delete abiertas[e.maq]; }
  }
  for(const k in abiertas) down += prodMin(abiertas[k], fin);
  const efectivo = Math.max(0, (esHoy ? prodMin(0,fin) : JORNADA) - down);
  return {fecha:d.fecha, esHoy, und, cajas:Math.floor(und/UXC), fallas, down, primero, ultimo, ritmo: efectivo>0 && und>0 ? und/efectivo*60 : null, costo: und*COSTO_U, inicio: !!d.inicio};
}
function renderHist(){
  if(!$('hist')) return;
  const dias = (S.hist||[]).map(resumenDia);
  const meta = S.cfg.meta;
  const refs = (S.cfg.historico||[]).filter(x=>x.unidades>0);
  const cerrados = dias.filter(d=>!d.esHoy && d.und>0);
  const prom = cerrados.length ? cerrados.reduce((s,d)=>s+d.und,0)/cerrados.length : null;
  $('histAside').textContent = dias.length ? `${cerrados.length} día${cerrados.length===1?'':'s'} cerrados${prom!=null?` · promedio ${nf0.format(prom)} und/día`:''}` : '';
  if(!dias.length){ $('histChart').innerHTML=''; $('hist').innerHTML = `<p class="empty">${S.dbState==='cargando'?'Cargando…':'Todavía no hay días registrados. Cada día que se registre producción queda guardado aquí automáticamente.'}</p>`; return; }
  // gráfica de barras: últimos 14 días (antiguo → reciente)
  const serie = dias.slice(0,14).reverse();
  const W=920,H=220,L=58,R=16,T=14,B=40;
  const ymax = niceMax(Math.max(1, ...serie.map(d=>d.und), meta||0, ...refs.map(x=>x.unidades))*1.08);
  const bw = (W-L-R)/serie.length;
  const y = v => T + (1-v/ymax)*(H-T-B);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Unidades producidas por día">`;
  for(let i=0;i<=4;i++){ const v=ymax/4*i; s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${nf0.format(v)}</text>`; }
  serie.forEach((d,i)=>{
    const w = Math.min(bw*.64, 64), x = L + i*bw + (bw-w)/2;
    const sel = d.fecha===S.viewKey;
    const fill = d.esHoy ? 'var(--accent-soft)' : 'var(--chart)';
    s += `<rect data-dia="${d.fecha}" x="${x}" y="${y(d.und)}" width="${w}" height="${Math.max(0,y(0)-y(d.und))}" fill="${fill}" stroke="${d.esHoy||sel?'var(--accent)':'none'}" stroke-width="${sel?3:1.5}" rx="3" style="cursor:pointer"><title>${d.fecha}: ${nf0.format(d.und)} und</title></rect>`;
    if(d.und>0) s += `<text x="${x+w/2}" y="${y(d.und)-5}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)">${nf0.format(d.und)}</text>`;
    const [yy,mm,dd]=d.fecha.split('-');
    s += `<text x="${x+w/2}" y="${H-22}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${dd}/${mm}</text>`;
    if(d.esHoy) s += `<text x="${x+w/2}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--accent)" font-weight="700">HOY</text>`;
  });
  if(meta) s += `<line x1="${L}" x2="${W-R}" y1="${y(meta)}" y2="${y(meta)}" stroke="var(--ok)" stroke-width="2"/><text x="${W-R-4}" y="${y(meta)-5}" text-anchor="end" font-size="11" fill="var(--ok)" font-weight="600">Meta ${nf0.format(meta)}</text>`;
  if(prom!=null) s += `<line x1="${L}" x2="${W-R}" y1="${y(prom)}" y2="${y(prom)}" stroke="var(--ref)" stroke-width="1.5" stroke-dasharray="4 4"/><text x="${L+6}" y="${y(prom)-5}" font-size="11" fill="var(--muted)">Promedio ${nf0.format(prom)}</text>`;
  s += `</svg>`;
  $('histChart').innerHTML = s + '<div class="tip" id="hTip"></div>';
  // tabla
  const base = meta || prom;
  const rows = dias.map(d=>{
    const dif = base && !d.esHoy ? d.und - base : null;
    return `<tr class="${d.fecha===S.viewKey?'sel':''}" data-dia="${d.fecha}" tabindex="0">
      <td>${esc(fmtFecha(d.fecha))}${d.esHoy?' <span class="pill ok">Hoy</span>':''}</td>
      <td><b>${nf0.format(d.und)}</b></td>
      <td>${nf0.format(d.cajas)}</td>
      <td>${d.ritmo?nf0.format(d.ritmo):'—'}</td>
      <td>${d.primero!=null?hhmm(d.primero):'—'} – ${d.ultimo!=null?hhmm(d.ultimo):'—'}</td>
      <td>${d.fallas||'0'}</td>
      <td>${d.down?nf0.format(d.down)+' min':'0'}</td>
      <td>${dif!=null?`<span class="${dif>=0?'delta-up':'delta-down'}">${dif>=0?'+':''}${nf0.format(dif)}</span>`:'—'}</td>
      <td>${money(d.costo)}</td>
    </tr>`;
  }).join('');
  $('hist').innerHTML = `<table class="hist"><thead><tr><th>Día</th><th>Unidades</th><th>Cajas</th><th>Ritmo und/h</th><th>1er – últ. reporte</th><th>Fallas</th><th>Detenida</th><th>Vs. ${meta?'meta':'promedio'}</th><th>Costo materiales</th></tr></thead><tbody>${rows}</tbody></table><p class="calc" style="margin:10px 0 0">Toca un día para verlo completo arriba (máquina, gráfica del turno, materiales y bitácora).</p>`;
}

const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
let wq = Promise.resolve();
function mutateDia(fn){
  const run = wq.then(async ()=>{
    const key = bog().key;
    const ref = S.db.doc('dias/'+key);
    const snap = await ref.get();
    const cur = snap.exists ? structuredClone(snap.data()) : {fecha:key, inicio:null, inicioTs:null, eventos:[]};
    if(!Array.isArray(cur.eventos)) cur.eventos = [];
    fn(cur);
    await ref.set(cur);
    return true;
  }).catch(err=>{ writeErr(err); return false; });
  wq = run.then(()=>{});
  return run;
}
const addEvent = ev => mutateDia(d=>{ d.eventos.push(ev); });
const setInicio = inicio => mutateDia(d=>{ d.inicio = inicio; d.inicioTs = Date.now(); });
const removeEvent = id => mutateDia(d=>{ d.eventos = d.eventos.filter(e=>e.id!==id); });
function writeErr(err){
  if(err?.code==='permission-denied') err={code:'invalid_argument'};
  if(err?.code==='invalid_argument'){ S.canWrite=false; toast('Tu usuario no tiene permiso para esta acción.', true); render(); }
  else if(err?.code==='quota_exceeded') toast('La base de datos está llena. Avisa a sistemas.', true);
  else toast('No se pudo guardar. Revisa la conexión e intenta de nuevo.', true);
}

function makeDB(fs, db){
  const snapDoc = s => ({id:s.id, exists:s.exists(), data:()=>s.data()});
  return {
    doc(p){
      const ref = fs.doc(db, ...p.split('/'));
      return {
        get: async () => snapDoc(await fs.getDoc(ref)),
        set: d => fs.setDoc(ref, d),
        onSnapshot: (n, e) => fs.onSnapshot(ref, s => n(snapDoc(s)), e)
      };
    },
    collection(p){
      const col = fs.collection(db, ...p.split('/')); const cons = [];
      const api = {
        orderBy(f, d){ cons.push(fs.orderBy(f, d)); return api; },
        limit(n){ cons.push(fs.limit(n)); return api; },
        onSnapshot(n, e){ return fs.onSnapshot(fs.query(col, ...cons), s => n({docs:s.docs.map(snapDoc)}), e); }
      };
      return api;
    }
  };
}

async function loadFirebase(){
  const base = `https://www.gstatic.com/firebasejs/${FB_V}/`;
  const [appM, authM, fsM] = await Promise.all([import(base+'firebase-app.js'), import(base+'firebase-auth.js'), import(base+'firebase-firestore.js')]);
  const app = appM.initializeApp(firebaseConfig);
  const auth = authM.getAuth(app);
  await authM.setPersistence(auth, authM.browserLocalPersistence);
  const db = fsM.getFirestore(app);
  return {auth, authM, fsM, db};
}

  startBoot(); render(); if(mode==='tv') wake();
}

$$('lEye').onclick = () => { const p=$$('lPass'); p.type = p.type==='password'?'text':'password'; $$('lEye').textContent = p.type==='password'?'Ver':'Ocultar'; };
$$('fLogin').addEventListener('submit', async e=>{
  e.preventDefault();
  let u = $$('lUser').value.trim().toLowerCase(), p = $$('lPass').value;
  if(!u || !p){ lerr('Escribe tu usuario y contraseña.'); return; }
  if(!u.includes('@')) u = `${u}@${DOMINIO_USUARIOS}`;
  busy(true); $$('lErr').textContent='';
  try{
    if(!FBX) FBX = await loadFirebase();
    const cred = await FBX.authM.signInWithEmailAndPassword(FBX.auth, u, p);
    await enterApp(cred.user);
  }catch(err){
    busy(false);
    const c = err?.code || '';
    if(/invalid-credential|wrong-password|user-not-found|invalid-email/.test(c)) lerr('Usuario o contraseña incorrectos.');
    else if(c.includes('too-many-requests')) lerr('Demasiados intentos. Espera unos minutos.');
    else if(c.includes('network')) lerr('Sin conexión a internet.');
    else if(c.includes('unauthorized-domain')) lerr('Este dominio no está autorizado en Firebase (Authentication → Configuración → Dominios autorizados).');
    else lerr('No se pudo iniciar sesión. Intenta de nuevo.');
  }
});
$$('salir').onclick = async () => { try{ await FBX.authM.signOut(FBX.auth); }catch(e){} try{ localStorage.removeItem('modo'); }catch(e){} location.reload(); };

// sesión recordada: el TV y la tablet entran solos
(async()=>{
  try{
    FBX = await loadFirebase();
    FBX.authM.onAuthStateChanged(FBX.auth, user=>{
      if(user && !S.user) enterApp(user);
      else if(!user){ $$('login').hidden=false; $$('lUser').focus(); }
    });
  }catch(e){ $$('login').hidden=false; lerr('No se pudo cargar. Revisa la conexión a internet.'); }
})();


/* ---------- reloj ---------- */
setInterval(()=>{
  if(!S.user) return;
  const k = bog().key;
  if(k!==S.todayKey){ const wasToday = S.viewKey===S.todayKey; S.todayKey=k; dIn.max=k; if(wasToday){ S.viewKey=k; dIn.value=k; subDia(); } }
  const ae = document.activeElement;
  if(ae && ae.closest && ae.closest('#panel') && (ae.tagName==='INPUT'||ae.tagName==='SELECT')) { $$('clock').textContent = hhmm(bog().min); return; }
  render();
}, 20000);
